<header>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="navbar-brand">Raúl Sosa</div>

        <ul class="navbar-nav">
            @if (hardcodedAuthService.isUserLoggedIn()) {
                <li><a routerLink="/welcome/Raúl%20Sosa" class="nav-link">Home</a></li>
                <li><a routerLink="/todos" class="nav-link">Todos</a></li>
            }
        </ul>

        <ul class="navbar-nav navbar-collapse justify-content-end">
            @if (!hardcodedAuthService.isUserLoggedIn()) {
                <li><a routerLink="/login" class="nav-link">Login</a></li>
            } @else {
                <li><a routerLink="/logout" class="nav-link">Logout</a></li>
            }           
        </ul>
    </nav>
</header>
